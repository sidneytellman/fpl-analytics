<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FPL Analytics</title>
  <style>
    body { font-family: Georgia, serif; background: #f4f4f2; color: #222;
           max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    h1 { margin-bottom: 4px; }
    p.sub { color: #777; margin-top: 0; }
    img { width: 100%; height: auto; margin: 24px 0;

</head>
<body>
  <h1>FPL Analytics</h1>
  <p class="sub">Updated automatically every week with GitHub Actions.</p>

  <img src="xg_vs_xa.png" alt="xG vs xA chart">
  <img src="value.png" alt="Points vs price chart">

  <footer>
    Data: Fantasy Premier League API ·
    <a href="https://github.com/sidneytellman/fpl-analytics">Source code</a>
  </footer>
